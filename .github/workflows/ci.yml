# PR / push: backend Django check + frontend build (deploydan oldin regressiya)
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Django system check
        env:
          DEBUG: 'False'
        run: |
          export SECRET_KEY="$(python -c 'import secrets;print(secrets.token_urlsafe(64))')"
          python manage.py check --deploy
      - name: Django check (DEBUG dev)
        env:
          DEBUG: 'True'
        run: python manage.py check
      - name: Migratsiyalar modellarga mos
        env:
          DEBUG: 'True'
        run: python manage.py makemigrations --check --dry-run
      - name: Testlar
        env:
          DEBUG: 'True'
        run: python manage.py test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Testlar
        run: npm run test:sse
      - run: npm run build

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Kodda sir yo'qligini tekshirish
        run: python scripts/check_secrets.py
