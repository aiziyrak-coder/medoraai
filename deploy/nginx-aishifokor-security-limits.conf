# http {} kontekstida yuklanadi — /etc/nginx/conf.d/
# DDoS / brute-force / flood himoyasi (aishifokor.uz)

limit_req_zone $binary_remote_addr zone=aishifokor_api:12m rate=25r/s;
limit_req_zone $binary_remote_addr zone=aishifokor_auth:12m rate=8r/m;
limit_req_zone $binary_remote_addr zone=aishifokor_general:12m rate=120r/m;
limit_conn_zone $binary_remote_addr zone=aishifokor_conn:12m;
