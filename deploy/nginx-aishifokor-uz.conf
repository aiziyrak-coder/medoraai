# aishifokor.uz — frontend SPA (/root/aishifokor/frontend/dist)
# api.aishifokor.uz — Django API (Gunicorn 127.0.0.1:8100)
#
# DNS: A yozuv → 164.90.186.193
# SSL: certbot --webroot -w /root/aishifokor/frontend/dist \
#   -d aishifokor.uz -d api.aishifokor.uz

map $http_origin $aishifokorapi_cors_origin {
    default "";
    "https://aishifokor.uz" $http_origin;
    "http://aishifokor.uz"  $http_origin;
    "https://www.aishifokor.uz" $http_origin;
    "http://www.aishifokor.uz"  $http_origin;
}

map "$request_method$aishifokorapi_cors_origin" $aishifokorapi_options_preflight_ok {
    default 0;
    "~^OPTIONShttps://aishifokor\.uz$" 1;
    "~^OPTIONShttp://aishifokor\.uz$" 1;
    "~^OPTIONShttps://www\.aishifokor\.uz$" 1;
    "~^OPTIONShttp://www\.aishifokor\.uz$" 1;
}

# ---------- Frontend: aishifokor.uz (HTTP → HTTPS) ----------
server {
    listen 80;
    server_name aishifokor.uz www.aishifokor.uz;
    location / {
        return 301 https://$host$request_uri;
    }
    location /.well-known/acme-challenge/ {
        root /root/aishifokor/frontend/dist;
    }
}

# Xavfsizlik headerlari (frontend)
map $sent_http_content_type $aishifokor_csp {
    default "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://aishifokor.uz https://api.aishifokor.uz wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'";
    "~^text/html" "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://aishifokor.uz https://api.aishifokor.uz wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'";
}

# ---------- Frontend: aishifokor.uz (HTTPS) ----------
server {
    listen 443 ssl http2;
    server_name aishifokor.uz www.aishifokor.uz;
    ssl_certificate     /etc/letsencrypt/live/aishifokor.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aishifokor.uz/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    server_tokens off;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy $aishifokor_csp always;

    root /root/aishifokor/frontend/dist;
    index index.html;
    charset utf-8;
    client_max_body_size 20M;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Skaner / exploit pathlari
    location ~ /\.(?!well-known) { deny all; return 404; }
    location ~* \.(env|git|sql|bak|old|swp|ini|log)$ { deny all; return 404; }
    location ~* ^/(wp-admin|wp-login|phpmyadmin|xmlrpc\.php|cgi-bin) { deny all; return 404; }

    location = /favicon.ico { log_not_found off; access_log off; return 204; }
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0, proxy-revalidate" always;
        include /etc/nginx/snippets/aishifokor-sec-headers.conf;
        add_header Content-Security-Policy $aishifokor_csp always;
    }
    location = /service-worker.js {
        default_type application/javascript;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        include /etc/nginx/snippets/aishifokor-sec-headers.conf;
    }
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        include /etc/nginx/snippets/aishifokor-sec-headers.conf;
    }
    # Faqat frontend dist (static/ va assets/ dan tashqari)
    location ~* ^/(?!static/|media/|api/|admin/|health/).*\.(webmanifest|ico|png|svg|css)$ {
        expires 7d;
        add_header Cache-Control "public" always;
        include /etc/nginx/snippets/aishifokor-sec-headers.conf;
    }

    location /api/ {
        limit_req zone=aishifokor_api burst=40 nodelay;
        limit_conn aishifokor_conn 30;
        proxy_pass http://127.0.0.1:8100/api/;
        proxy_http_version 1.1;
        proxy_set_header Host api.aishifokor.uz;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 15s;
        proxy_send_timeout 120s;
    }
    location /health/ {
        proxy_pass http://127.0.0.1:8100/health/;
        proxy_http_version 1.1;
        proxy_set_header Host api.aishifokor.uz;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }
    location ^~ /admin/ {
        limit_req zone=aishifokor_admin burst=40 nodelay;
        proxy_pass http://127.0.0.1:8100/admin/;
        proxy_http_version 1.1;
        proxy_set_header Host aishifokor.uz;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 15s;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval' https: data: blob:; img-src 'self' data: https:; font-src 'self' data: https:; style-src 'self' 'unsafe-inline' https:;" always;
    }
    location = /admin {
        return 301 https://$host/admin/;
    }
    location ^~ /static/ {
        alias /root/aishifokor/backend/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable" always;
        access_log off;
    }
    location ^~ /media/ {
        alias /root/aishifokor/backend/media/;
        expires 7d;
        access_log off;
    }
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0, proxy-revalidate" always;
        include /etc/nginx/snippets/aishifokor-sec-headers.conf;
        add_header Content-Security-Policy $aishifokor_csp always;
        try_files $uri $uri/ /index.html;
    }
}

# ---------- API: api.aishifokor.uz (HTTP → HTTPS) ----------
server {
    listen 80;
    server_name api.aishifokor.uz;
    location / { return 301 https://$host$request_uri; }
    location /.well-known/acme-challenge/ { root /root/aishifokor/frontend/dist; }
}

# CORS faqat Django (corsheaders) orqali — nginx qo'shmasin (duplicate header xatosi)
# ---------- API: api.aishifokor.uz (HTTPS) — Gunicorn 8100 ----------
server {
    listen 443 ssl;
    server_name api.aishifokor.uz;
    ssl_certificate     /etc/letsencrypt/live/aishifokor.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aishifokor.uz/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    server_tokens off;
    client_max_body_size 20M;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;

    location ~ /\.(?!well-known) { deny all; return 404; }
    location ~* \.(env|git|sql|bak|old|swp|ini|log)$ { deny all; return 404; }
    location ~* ^/(wp-admin|wp-login|phpmyadmin|xmlrpc\.php|cgi-bin) { deny all; return 404; }
    location ~* ^/(swagger|redoc|api/docs) { return 404; }
    location = /admin { return 301 https://aishifokor.uz/admin/; }
    location ^~ /admin/ { return 301 https://aishifokor.uz$request_uri; }
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 256;
    gzip_types application/json application/javascript text/plain text/css application/xml;

    location = /health/ {
        if ($aishifokorapi_options_preflight_ok = 1) {
            add_header Access-Control-Allow-Origin $aishifokorapi_cors_origin always;
            add_header Access-Control-Allow-Methods 'GET, OPTIONS' always;
            add_header Access-Control-Allow-Headers 'Accept, Authorization, Content-Type, X-Device-Id, X-Device-Info' always;
            add_header Access-Control-Allow-Credentials 'true' always;
            add_header Content-Length 0;
            return 204;
        }
        proxy_pass http://127.0.0.1:8100/health/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    # Botlar POST / yubormasin — faqat /api/ va /health/ orqali
    location = / {
        if ($request_method = POST) { return 405; }
        if ($aishifokorapi_options_preflight_ok = 1) {
            add_header Access-Control-Allow-Origin $aishifokorapi_cors_origin always;
            add_header Access-Control-Allow-Methods 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
            add_header Access-Control-Allow-Headers 'Accept, Accept-Encoding, Authorization, Content-Type, DNT, Origin, User-Agent, X-Device-Id, X-Device-Info, X-CSRFToken, X-Requested-With' always;
            add_header Access-Control-Allow-Credentials 'true' always;
            add_header Content-Length 0;
            return 204;
        }
        return 404;
    }

    location ^~ /api/auth/ {
        limit_req zone=aishifokor_auth burst=6 nodelay;
        limit_conn aishifokor_conn 15;
        if ($aishifokorapi_options_preflight_ok = 1) {
            add_header Access-Control-Allow-Origin $aishifokorapi_cors_origin always;
            add_header Access-Control-Allow-Methods 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
            add_header Access-Control-Allow-Headers 'Accept, Accept-Encoding, Authorization, Content-Type, DNT, Origin, User-Agent, X-Device-Id, X-Device-Info, X-CSRFToken, X-Requested-With' always;
            add_header Access-Control-Allow-Credentials 'true' always;
            add_header Access-Control-Max-Age 86400 always;
            add_header Content-Length 0;
            return 204;
        }
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 15s;
        proxy_send_timeout 60s;
    }

    location ^~ /api/ {
        limit_req zone=aishifokor_api burst=50 nodelay;
        limit_conn aishifokor_conn 40;
        if ($aishifokorapi_options_preflight_ok = 1) {
            add_header Access-Control-Allow-Origin $aishifokorapi_cors_origin always;
            add_header Access-Control-Allow-Methods 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
            add_header Access-Control-Allow-Headers 'Accept, Accept-Encoding, Authorization, Content-Type, DNT, Origin, User-Agent, X-Device-Id, X-Device-Info, X-CSRFToken, X-Requested-With' always;
            add_header Access-Control-Allow-Credentials 'true' always;
            add_header Access-Control-Max-Age 86400 always;
            add_header Content-Length 0;
            return 204;
        }
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 15s;
        proxy_send_timeout 300s;
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 8 256k;
        proxy_busy_buffers_size 512k;
    }

    location / {
        return 404;
    }
    location ^~ /static/ {
        alias /root/aishifokor/backend/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable" always;
        access_log off;
    }
    location ^~ /media/ {
        alias /root/aishifokor/backend/media/;
        expires 7d;
        access_log off;
    }
}
