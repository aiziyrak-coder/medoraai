# aishifokor.uz — frontend SPA (/root/aishifokor/frontend/dist)
# api.aishifokor.uz — Django API (Gunicorn 127.0.0.1:8100)
#
# DNS: A yozuv → 164.90.186.193
# SSL: certbot --webroot -w /root/aishifokor/frontend/dist \
#   -d aishifokor.uz -d api.aishifokor.uz

map $http_origin $aishifokorapi_cors_origin {
    default "";
    "https://aishifokor.uz" $http_origin;
    "http://aishifokor.uz"  $http_origin;
    "https://www.aishifokor.uz" $http_origin;
    "http://www.aishifokor.uz"  $http_origin;
}

map "$request_method$aishifokorapi_cors_origin" $aishifokorapi_options_preflight_ok {
    default 0;
    "~^OPTIONShttps://aishifokor\.uz$" 1;
    "~^OPTIONShttp://aishifokor\.uz$" 1;
    "~^OPTIONShttps://www\.aishifokor\.uz$" 1;
    "~^OPTIONShttp://www\.aishifokor\.uz$" 1;
}

# ---------- Frontend: aishifokor.uz (HTTP → HTTPS) ----------
server {
    listen 80;
    server_name aishifokor.uz www.aishifokor.uz;
    location / {
        return 301 https://$host$request_uri;
    }
    location /.well-known/acme-challenge/ {
        root /root/aishifokor/frontend/dist;
    }
}

# ---------- Frontend: aishifokor.uz (HTTPS) ----------
server {
    listen 443 ssl http2;
    server_name aishifokor.uz www.aishifokor.uz;
    ssl_certificate     /etc/letsencrypt/live/aishifokor.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aishifokor.uz/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    root /root/aishifokor/frontend/dist;
    index index.html;
    charset utf-8;
    client_max_body_size 20M;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    location = /favicon.ico { log_not_found off; access_log off; return 204; }
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0, proxy-revalidate" always;
    }
    location = /service-worker.js {
        default_type application/javascript;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    }
    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
    location ~* \.(webmanifest|ico|png|svg|css)$ { expires 7d; add_header Cache-Control "public"; }

    location /api/ {
        proxy_pass http://127.0.0.1:8100/api/;
        proxy_http_version 1.1;
        proxy_set_header Host api.aishifokor.uz;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 15s;
        proxy_send_timeout 120s;
    }
    location /health/ {
        proxy_pass http://127.0.0.1:8100/health/;
        proxy_http_version 1.1;
        proxy_set_header Host api.aishifokor.uz;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }
    location /static/ { alias /root/aishifokor/backend/staticfiles/; expires 30d; }
    location /media/  { alias /root/aishifokor/backend/media/; expires 7d; }
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0, proxy-revalidate" always;
        try_files $uri $uri/ /index.html;
    }
}

# ---------- API: api.aishifokor.uz (HTTP → HTTPS) ----------
server {
    listen 80;
    server_name api.aishifokor.uz;
    location / { return 301 https://$host$request_uri; }
    location /.well-known/acme-challenge/ { root /root/aishifokor/frontend/dist; }
}

# CORS faqat Django (corsheaders) orqali — nginx qo'shmasin (duplicate header xatosi)
# ---------- API: api.aishifokor.uz (HTTPS) — Gunicorn 8100 ----------
server {
    listen 443 ssl;
    server_name api.aishifokor.uz;
    ssl_certificate     /etc/letsencrypt/live/aishifokor.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aishifokor.uz/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    client_max_body_size 20M;
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 256;
    gzip_types application/json application/javascript text/plain text/css application/xml;

    location = /health/ {
        if ($aishifokorapi_options_preflight_ok = 1) {
            add_header Access-Control-Allow-Origin $aishifokorapi_cors_origin always;
            add_header Access-Control-Allow-Methods 'GET, OPTIONS' always;
            add_header Access-Control-Allow-Headers 'Accept, Authorization, Content-Type, X-Device-Id, X-Device-Info' always;
            add_header Access-Control-Allow-Credentials 'true' always;
            add_header Content-Length 0;
            return 204;
        }
        proxy_pass http://127.0.0.1:8100/health/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    location ^~ /api/ {
        if ($aishifokorapi_options_preflight_ok = 1) {
            add_header Access-Control-Allow-Origin $aishifokorapi_cors_origin always;
            add_header Access-Control-Allow-Methods 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
            add_header Access-Control-Allow-Headers 'Accept, Accept-Encoding, Authorization, Content-Type, DNT, Origin, User-Agent, X-Device-Id, X-Device-Info, X-CSRFToken, X-Requested-With' always;
            add_header Access-Control-Allow-Credentials 'true' always;
            add_header Access-Control-Max-Age 86400 always;
            add_header Content-Length 0;
            return 204;
        }
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 15s;
        proxy_send_timeout 300s;
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 8 256k;
        proxy_busy_buffers_size 512k;
    }

    location / {
        if ($aishifokorapi_options_preflight_ok = 1) {
            add_header Access-Control-Allow-Origin $aishifokorapi_cors_origin always;
            add_header Access-Control-Allow-Methods 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
            add_header Access-Control-Allow-Headers 'Accept, Accept-Encoding, Authorization, Content-Type, DNT, Origin, User-Agent, X-Device-Id, X-Device-Info, X-CSRFToken, X-Requested-With' always;
            add_header Access-Control-Allow-Credentials 'true' always;
            add_header Access-Control-Max-Age 86400 always;
            add_header Content-Length 0;
            return 204;
        }
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 15s;
        proxy_send_timeout 300s;
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 8 256k;
        proxy_busy_buffers_size 512k;
    }
    location /static/ { alias /root/aishifokor/backend/staticfiles/; expires 30d; }
    location /media/  { alias /root/aishifokor/backend/media/; expires 7d; }
}
