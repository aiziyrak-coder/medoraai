# fjsti.ziyrak.org — frontend SPA (/root/aidoktorfjsti/frontend/dist)
# fjstiapi.ziyrak.org — Django API (Gunicorn 127.0.0.1:8099)
#
# DNS: A yozuv → server IP (167.71.53.238)
# SSL: certbot --webroot -w /root/aidoktorfjsti/frontend/dist \
#   -d fjsti.ziyrak.org -d fjstiapi.ziyrak.org

# ---------- Frontend: fjsti.ziyrak.org (HTTP → HTTPS) ----------
server {
    listen 80;
    server_name fjsti.ziyrak.org;
    location / {
        return 301 https://$host$request_uri;
    }
    location /.well-known/acme-challenge/ {
        root /root/aidoktorfjsti/frontend/dist;
    }
}

# ---------- Frontend: fjsti.ziyrak.org (HTTPS) ----------
server {
    listen 443 ssl http2;
    server_name fjsti.ziyrak.org;
    ssl_certificate     /etc/letsencrypt/live/fjsti.ziyrak.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fjsti.ziyrak.org/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    root /root/aidoktorfjsti/frontend/dist;
    index index.html;
    charset utf-8;
    client_max_body_size 20M;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    location = /favicon.ico { log_not_found off; access_log off; return 204; }
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0, proxy-revalidate" always;
    }
    location = /service-worker.js {
        default_type application/javascript;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    }
    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
    location ~* \.(webmanifest|ico|png|svg|css)$ { expires 7d; add_header Cache-Control "public"; }

    location /api/ {
        proxy_pass http://127.0.0.1:8099/api/;
        proxy_http_version 1.1;
        proxy_set_header Host fjstiapi.ziyrak.org;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 15s;
        proxy_send_timeout 120s;
    }
    location /health/ {
        proxy_pass http://127.0.0.1:8099/health/;
    }
    location /static/ { alias /root/aidoktorfjsti/backend/staticfiles/; expires 30d; }
    location /media/  { alias /root/aidoktorfjsti/backend/media/; expires 7d; }
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0, proxy-revalidate" always;
        try_files $uri $uri/ /index.html;
    }
}

# ---------- API: fjstiapi.ziyrak.org (HTTP → HTTPS) ----------
server {
    listen 80;
    server_name fjstiapi.ziyrak.org;
    location / { return 301 https://$host$request_uri; }
    location /.well-known/acme-challenge/ { root /root/aidoktorfjsti/frontend/dist; }
}

# ---------- API: fjstiapi.ziyrak.org (HTTPS) — Gunicorn 8099 ----------
server {
    listen 443 ssl;
    server_name fjstiapi.ziyrak.org;
    ssl_certificate     /etc/letsencrypt/live/fjsti.ziyrak.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fjsti.ziyrak.org/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    client_max_body_size 20M;
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 256;
    gzip_types application/json application/javascript text/plain text/css application/xml;

    location / {
        proxy_pass http://127.0.0.1:8099;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 15s;
        proxy_send_timeout 120s;
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 8 256k;
        proxy_busy_buffers_size 512k;
    }
    location /static/ { alias /root/aidoktorfjsti/backend/staticfiles/; expires 30d; }
    location /media/  { alias /root/aidoktorfjsti/backend/media/; expires 7d; }
}
